name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test -- --runInBand

      - name: Build
        run: pnpm run build
